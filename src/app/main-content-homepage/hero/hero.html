<section class="hero">
    <div class="hero_content">
        <button class="hero_greetings" [class.expanded]="greetingExpanded()" [attr.aria-expanded]="greetingExpanded()"
            (mouseenter)="showGreeting()" (mouseleave)="hideGreeting()" (focus)="showGreeting()"
            (blur)="hideGreeting()">{{ (greetingExpanded() ? 'hero.greetingExpanded' : 'hero.greeting') | translate }}
        </button>
        @if (greetingExpanded()) {
        <span class="hero_greeting_emoji" aria-hidden="true">🙋🏻‍♀️</span>
        }

        <h1 class="hero_title">
            <span>
                @for (letter of titleLineOneLetters; track $index) {
                <span class="hero_title_letter" [class.is-uppercase]="letter === letter.toUpperCase()"
                    [class.is-lowercase]="letter === letter.toLowerCase()">{{letter}}</span>
                }
            </span>

            <span>
                @for (letter of titleLineTwoLetters; track $index) {
                <span class="hero_title_letter" [class.is-uppercase]="letter === letter.toUpperCase()"
                    [class.is-lowercase]="letter === letter.toLowerCase()">{{letter}}</span>
                }
            </span>
        </h1>

        <button class="hero_contact" type="button" (click)="contactMe()">
            {{ 'hero.getInTouch' | translate }}
        </button>
    </div>

    <figure class="hero_photo">
        <img src="./images/Neelima.jpeg" alt="Neelima image" />
        <figcaption>
            <span>{{ 'hero.photoCaption' | translate }} 🙂</span>
            <span>{{ 'hero.photoCaption' | translate }} 😄</span>
        </figcaption>
    </figure>

</section>

<div class="hero_social_media">
    @for (social of socialLinks; track social.label) {
    <a [href]="social.href">
        <img [src]="social.src" alt="social.label" />
    </a>
    }
</div>
