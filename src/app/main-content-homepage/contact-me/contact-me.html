<section class="contact contact--textured" id="contact" aria-labelledby="contact-title">
    <div class="contact__container">
        <div class="contact__main">
            <div class="contact__copy">
                <p class="contact__eyebrow">{{ content.eyebrow }}</p>
                <h2 id="contact-title">{{ content.title }}</h2>

                @for (paragraph of content.paragraphs; track paragraph) {
                <p>{{ paragraph }}</p>
                }

                <img class="contact__arrow" [src]="assets.arrow" alt="" />
            </div>

            <form class="contact__form" (submit)="onSubmit($event)">
                <div class="contact__field">
                    <label for="contact-name">{{ content.nameLabel }}</label>
                    <input id="contact-name" name="name" type="text" [placeholder]="content.namePlaceholder"
                        autocomplete="name" maxlength="100" required />
                </div>

                <div class="contact__field">
                    <label for="contact-email">{{ content.emailLabel }}</label>
                    <input id="contact-email" name="email" type="email" [placeholder]="content.emailPlaceholder"
                        autocomplete="email" maxlength="254" required />
                </div>

                <div class="contact__field">
                    <label for="contact-message">{{ content.messageLabel }}</label>
                    <textarea id="contact-message" name="message" [placeholder]="content.messagePlaceholder" rows="3"
                        minlength="10" maxlength="4000" required></textarea>
                </div>

                <label class="contact__consent">
                    <input name="privacy" type="checkbox" required />
                    <span>{{ content.consent }}</span>
                </label>

                <button class="contact__submit" type="submit">
                    {{ content.sendLabel }}
                </button>
            </form>
        </div>
    </div>
</section>
