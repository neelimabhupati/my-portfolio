<header class="header" [class.menu-open]="menuOpen()">
    <a class="logo" href="" aria-label="Home">
        <img src="/icons/letter-n.png" alt="" />
    </a>

    <button class="menu-toggle" type="button" [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'" (click)="toggleMenu()">
        @if (menuOpen()) {
        <span class="close-icon"></span>
        } @else {
        <img src="/icons/menu.png" alt="" />
        }
    </button>

    <nav class="nav" aria-label="Main navigation">
        <a class="nav-about" href="#aboutme" (click)="closeMenu()">{{ 'header.aboutMe' | translate }}</a>
        <a class="nav-skills" href="#skills" (click)="closeMenu()">{{ 'header.skills' | translate }}</a>
        <a class="nav-projects" href="#my_project" (click)="closeMenu()">{{ 'header.projects' | translate }}</a>
        <a class="nav-contact" href="#contact" (click)="closeMenu()">{{ 'header.contact' | translate }}</a>
    </nav>

    <div class="language-switcher" aria-label="Switch language">
        <app-languages></app-languages>
    </div>

    <div class="header-socials">
        @for (social of socialLinks; track social.label) {
        <a [href]="social.href" [attr.aria-label]="social.label">
            <img [src]="social.src" alt="" />
        </a>
        }
    </div>

</header>
